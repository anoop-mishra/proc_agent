services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-fixture}
    ports:
      - "8000:8000"

  ui:
    build: .
    command: streamlit run ui.py --server.address=0.0.0.0 --server.port=8501
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
